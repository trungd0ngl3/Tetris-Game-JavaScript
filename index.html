<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="main-menu" class="menu">
            <h1>Tetris</h1>
            <button id="start-button">Start</button>
        </div>
        <div id="game">
            <div id="left-panel">
                <div id="hold-container" class="panel">
                    <div class="panel-title">Hold</div>
                    <table id="hold-board"></table>
                </div>
                <div id="highscore-container" class="panel stat-panel">
                    <div class="stat-label">Highscore</div>
                    <div id="highscore" class="stat-value">0</div>
                </div>
                <div id="stats-container" class="panel">

                    <div class="stat-group">
                        <div class="stat-label">Level</div>
                        <div id="level" class="stat-value">1</div>
                    </div>

                    <div class="stat-group">
                        <div class="stat-label">Score</div>
                        <div id="score" class="stat-value">0</div>
                    </div>

                    <div class="stat-group">
                        <div class="stat-label">Lines</div>
                        <div id="lines" class="stat-value">0</div>
                    </div>

                </div>

            </div>
            <div id="board-container">
                <table id="game-board"></table>
            </div>

            <div id="right-panel">

                <div id="next-container" class="panel">
                    <div class="panel-title">Next</div>
                    <table id="next-board"></table>
                </div>

            </div>

        </div>
        <button id="pause-game-button" aria-label="Pause">
            <span></span>
            <span></span>
        </button>
        <div id="pause-menu" class="menu">
            <h2>Paused</h2>
            <button id="resume-button">Resume</button>
            <button id="restart-button">Restart</button>
            <button id="main-menu-button">Main Menu</button>
        </div>

        <div id="game-over-menu" class="menu">
            <h2>Game Over</h2>

            <div id="final-score">Score: 0</div>
            <div id="final-level">Level: 1</div>

            <button id="retry-button">Retry</button>
            <button id="game-over-main-menu-button">
                Main Menu
            </button>
        </div>

    </div>

    <script src="ui.js"></script>
    <script src="script.js"></script>
</body>
</html>
